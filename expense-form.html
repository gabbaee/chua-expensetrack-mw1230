<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <h2>ExpenseTrack</h2>

            <nav>
                <a href="index.html">Dashboard</a>
                <a href="expenses.html">Expenses</a>
            </nav>
        </aside>

        <main class="main-content">

            <div class="page-header">
                <h1 id="form-title">Add Expense</h1>
                <p id="form-subtitle">Enter the expense information below</p>
            </div>

            <div class="form-card">

                <form id="expense-form">

                    <div class="form-group">

                        <label for="expense-name">Expense Name</label>

                        <input type="text" id="expense-name" name="name" placeholder="Enter expense name" required >

                    </div>

                    <div class="form-group">

                        <label for="expense-amount"> Amount </label>

                        <input type="number" id="expense-amount" name="amount" min="0.01" step="0.01" placeholder="Enter amount" required>

                    </div>

                    <div class="form-group">

                        <label for="expense-category">Category</label>

                        <select id="expense-category" name="category" required>

                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <div class="form-actions">

                        <a href="expenses.html" class="cancel-button">Cancel</a>

                        <button type="submit" class="button" id="save-button">Add Expense</button>

                    </div>

                </form>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
