<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <h2>ExpenseTrack</h2>

            <nav>
                <a href="index.html" class="active">Dashboard</a>
                <a href="expenses.html">Expenses</a>
            </nav>
        </aside>

        <main class="main-content">

            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Overview of your expenses</p>
            </div>

            <div class="cards">

                <div class="card">
                    <p>Total Expenses</p>
                    <h2 id="dashboard-total">₱0.00</h2>
                </div>

                <div class="card">
                    <p>Food</p>
                    <h2 id="food-total">₱0.00</h2>
                </div>

                <div class="card">
                    <p>Transport</p>
                    <h2 id="transpo-total">₱0.00</h2>
                </div>

                <div class="card">
                    <p>Others</p>
                    <h2 id="other-total">₱0.00</h2>
                </div>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
